[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipo-watch"
version = "0.1.0"
description = "Monitor SEC IPO filings, prediction markets and social signals; structure them for IPO pricing models."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "lxml>=5.2",
    "beautifulsoup4>=4.12",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "apscheduler>=3.10",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "respx>=0.21", "ruff>=0.5"]
pdf = ["pdfplumber>=0.11"]
llm = ["anthropic>=0.40"]
api = ["fastapi>=0.111", "uvicorn>=0.30"]

[project.scripts]
ipo-watch = "ipo_watch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: hits live external APIs (deselect with -m 'not integration')"]

[tool.ruff]
line-length = 100
target-version = "py312"
